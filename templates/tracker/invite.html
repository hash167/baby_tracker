{% extends "base.html" %}

{% block title %}Invitation · Baby Tracker{% endblock %}

{% block content %}
<section class="card narrow">
  <h1>Accept invitation</h1>
  {% if problem %}
    <p class="error" role="alert">{{ problem }}</p>
  {% else %}
    <p>Choose a password for {{ invitation.email }}.</p>
    <form method="post">
      {% csrf_token %}
      <label>Password
        <input name="new_password1" type="password" autocomplete="new-password" required>
      </label>
      <label>Confirm password
        <input name="new_password2" type="password" autocomplete="new-password" required>
      </label>
      <button type="submit">Create account</button>
    </form>
  {% endif %}
</section>
{% endblock %}
