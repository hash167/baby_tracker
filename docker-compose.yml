# Local PostgreSQL for development and pytest (major version aligned with planned production).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: baby_tracker
      POSTGRES_USER: baby_tracker
      POSTGRES_PASSWORD: baby_tracker
    ports:
      # Loopback only — do not publish on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - baby_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby_tracker -d baby_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    build: .
    command: ["python", "/app/docker/migrate.py"]
    environment:
      DJANGO_SECRET_KEY: local-compose-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: baby_tracker
      POSTGRES_USER: baby_tracker
      POSTGRES_PASSWORD: baby_tracker
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: local-compose-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: baby_tracker
      POSTGRES_USER: baby_tracker
      POSTGRES_PASSWORD: baby_tracker
      IMPORT_ROOT: /var/lib/baby-tracker/imports
      BACKUP_DIR: /var/lib/baby-tracker/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  baby_tracker_pgdata:
