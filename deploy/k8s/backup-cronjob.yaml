apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baby-tracker-backups
  namespace: baby-tracker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: baby-tracker-backup
  namespace: baby-tracker
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: baby-tracker
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: backup
              image: ghcr.io/hash167/baby_tracker:REPLACE_SHA
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "backup_database"]
              envFrom:
                - configMapRef:
                    name: baby-tracker-config
              env:
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: baby-tracker-app
                      key: DJANGO_SECRET_KEY
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: baby-tracker-db
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: baby-tracker-db
                      key: POSTGRES_PASSWORD
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: baby-tracker-backup
                      key: BACKUP_ENCRYPTION_KEY
              volumeMounts:
                - name: backups
                  mountPath: /var/lib/baby-tracker/backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: baby-tracker-backups
