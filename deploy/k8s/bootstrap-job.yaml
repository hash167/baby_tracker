# One-off first household. Not part of deploy/k8s/kustomization.yaml.
# Edit the placeholders below before the first apply. Do not commit real values.
# The password stays in Secret baby-tracker-bootstrap (key BOOTSTRAP_ADMIN_PASSWORD).
# A later apply exits 0 when the household or that admin already exists and
# does not change the existing password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: baby-tracker-bootstrap
  namespace: baby-tracker
data:
  BOOTSTRAP_ADMIN_USERNAME: REPLACE_USERNAME
  BOOTSTRAP_ADMIN_EMAIL: REPLACE_EMAIL@example.com
  BOOTSTRAP_HOUSEHOLD_NAME: REPLACE_HOUSEHOLD
  BOOTSTRAP_BABY_NAME: REPLACE_BABY
  BOOTSTRAP_TIMEZONE: America/Los_Angeles
---
apiVersion: batch/v1
kind: Job
metadata:
  name: baby-tracker-bootstrap
  namespace: baby-tracker
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baby-tracker
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bootstrap
          image: ghcr.io/hash167/baby_tracker:REPLACE_SHA
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "bootstrap_household"]
          envFrom:
            - configMapRef:
                name: baby-tracker-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-app
                  key: DJANGO_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_PASSWORD
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_USERNAME
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_EMAIL
            - name: BOOTSTRAP_HOUSEHOLD_NAME
              valueFrom:
                configMapKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_HOUSEHOLD_NAME
            - name: BOOTSTRAP_BABY_NAME
              valueFrom:
                configMapKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_BABY_NAME
            - name: BOOTSTRAP_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_TIMEZONE
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
