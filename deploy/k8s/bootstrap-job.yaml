# One-shot first household. Every value comes from the Secret
# baby-tracker-bootstrap. Do not put names, emails, or passwords in this file.
# Run after baby-tracker-migrate. Re-running fails if that username exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: baby-tracker-bootstrap
  namespace: baby-tracker
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baby-tracker
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: bootstrap
          image: ghcr.io/hash167/baby_tracker:REPLACE_SHA
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "bootstrap_household"]
          envFrom:
            - configMapRef:
                name: baby-tracker-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-app
                  key: DJANGO_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_PASSWORD
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_USERNAME
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_PASSWORD
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_ADMIN_EMAIL
            - name: BOOTSTRAP_HOUSEHOLD_NAME
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_HOUSEHOLD_NAME
            - name: BOOTSTRAP_BABY_NAME
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_BABY_NAME
            - name: BOOTSTRAP_TIMEZONE
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-bootstrap
                  key: BOOTSTRAP_TIMEZONE
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
