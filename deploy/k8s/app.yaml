apiVersion: v1
kind: Service
metadata:
  name: baby-tracker
  namespace: baby-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: baby-tracker
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baby-tracker
  namespace: baby-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: baby-tracker
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baby-tracker
        app.kubernetes.io/component: app
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          image: ghcr.io/hash167/baby_tracker:REPLACE_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: baby-tracker-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-app
                  key: DJANGO_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: imports
              mountPath: /var/lib/baby-tracker/imports
      volumes:
        - name: imports
          persistentVolumeClaim:
            claimName: baby-tracker-imports
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baby-tracker-imports
  namespace: baby-tracker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
