apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-private
  namespace: baby-tracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: baby-tracker-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: baby-tracker
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: baby-tracker
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress
  namespace: baby-tracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: baby-tracker
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-ingress
  namespace: baby-tracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: baby-tracker
      app.kubernetes.io/component: otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: baby-tracker
      ports:
        - protocol: TCP
          port: 4318
