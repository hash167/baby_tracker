apiVersion: batch/v1
kind: Job
metadata:
  name: baby-tracker-migrate
  namespace: baby-tracker
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baby-tracker
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/hash167/baby_tracker:REPLACE_SHA
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/docker/migrate.py"]
          envFrom:
            - configMapRef:
                name: baby-tracker-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-app
                  key: DJANGO_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: baby-tracker-db
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
