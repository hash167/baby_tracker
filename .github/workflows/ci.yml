# Required status checks: CI / lint, CI / pytest, CI / migrations, CI / playwright.
# Security jobs below also fail this workflow: dependency-audit, bandit,
# deploy-check, and secrets. Branch protection is a repository setting and is
# not configured here.
# Credentials match docker-compose.yml. They are local/dev values, not production secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  POSTGRES_DB: baby_tracker
  POSTGRES_USER: baby_tracker
  POSTGRES_PASSWORD: baby_tracker
  DJANGO_SECRET_KEY: ci-not-a-production-secret
  DJANGO_SETTINGS_MODULE: config.settings.local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baby_tracker
          POSTGRES_USER: baby_tracker
          POSTGRES_PASSWORD: baby_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_tracker -d baby_tracker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: pytest
        run: uv run pytest

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baby_tracker
          POSTGRES_USER: baby_tracker
          POSTGRES_PASSWORD: baby_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_tracker -d baby_tracker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Migrate from an empty database
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check

  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: baby_tracker
          POSTGRES_USER: baby_tracker
          POSTGRES_PASSWORD: baby_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby_tracker -d baby_tracker"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and start the app
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/runserver.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "runserver did not become ready" >&2
          cat /tmp/runserver.log >&2
          exit 1
      - name: Playwright smoke test
        run: ./scripts/e2e.sh
      - name: Show server log
        if: failure()
        run: cat /tmp/runserver.log || true
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Audit locked dependencies
        run: ./scripts/audit_dependencies.sh

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Bandit
        run: ./scripts/bandit.sh

  deploy-check:
    name: deploy-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --frozen
      - name: Django check --deploy
        run: ./scripts/deploy_check.sh

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Scan working tree and full git history
        run: ./scripts/scan_secrets.sh
      - name: Block CSV exports and database dumps
        run: python3 scripts/forbid_data_files.py --all
      - name: Pre-commit hooks
        run: uvx pre-commit==4.7.0 run --all-files
