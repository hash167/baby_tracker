[project]
name = "baby-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-htmx>=1.29.0",
    "gunicorn>=26.2.0",
    "psycopg>=3.3.8",
    "whitenoise>=6.11.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = ["-q"]
# Do not pass --reuse-db: the test database is created and destroyed each run.
